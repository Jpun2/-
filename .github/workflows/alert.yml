name: RSI/MACD Alert Check

on:
  schedule:
    # 매시 정각. 종목 7개 x 조건 3종 = 실행당 약 28회 API 호출.
    # 무료 요금제 하루 800회 한도 안에서 여유있게 돌아가도록 1시간 간격으로 설정.
    - cron: "0 * * * *"
  workflow_dispatch: {}   # Actions 탭에서 수동으로도 실행 가능

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run alert check
        env:
          TWELVEDATA_API_KEY: ${{ secrets.TWELVEDATA_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python alert.py

      - name: Commit updated state
        run: |
          git config user.name "rsi-alert-bot"
          git config user.email "actions@users.noreply.github.com"
          git add state.json
          git diff --cached --quiet || git commit -m "update alert state [skip ci]"
          git push
